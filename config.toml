# 관심 지역과 조건 설정 파일
# 금액 단위: 만원 (예: 50000 = 5억),  면적 단위: 전용 ㎡ (59㎡ ≈ 25평형, 84㎡ ≈ 33평형)
# 0 또는 빈 목록 = 제한 없음

[regions]
gu = ["마포구", "용산구", "성동구"]   # 빈 목록 [] 이면 서울 25개 구 전체
dong = []                              # 특정 동만 보고 싶을 때, 예: ["공덕동", "아현동"]

[filters]
trade = ["전세", "월세"]
deposit_max = 0           # 보증금 상한
monthly_rent_max = 0      # 월세 상한
area_min = 0              # 전용면적 하한
area_max = 0              # 전용면적 상한
build_year_min = 0        # 이 연도 이후 준공만
new_contracts_only = false  # true면 갱신 계약 제외, 신규 계약만

[molit]
months = 3                # 최근 몇 개월치 거래를 볼지
